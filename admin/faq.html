<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kelola FAQ / Tanya Jawab | Kenes Souvenir Kantor</title>
  <meta name="robots" content="noindex, nofollow">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,600;1,6..96,400&family=Hanken+Grotesk:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/style.css">
  <link rel="stylesheet" href="/assets/css/admin.css">
</head>
<body class="admin-body">

  <div id="adminSidebarContainer"></div>

  <div class="admin-main-wrap">
    <div id="adminTopbarContainer"></div>

    <main class="admin-content-area">
      <div class="d-flex flex-wrap justify-content-between align-items-center mb-4 gap-3">
        <div>
          <span class="eyebrow">Tanya Jawab</span>
          <h1 class="h2 mb-0">Pertanyaan yang Sering Diajukan</h1>
          <p class="text-muted-custom small mb-0">Kelola FAQ untuk mempermudah calon pelanggan memahami proses pemesanan.</p>
        </div>
        <button type="button" class="btn-primary-custom" id="btnOpenAddFaq">
          + Tambah Pertanyaan FAQ
        </button>
      </div>

      <div class="admin-card">
        <div class="admin-table-wrap">
          <table class="admin-table">
            <thead>
              <tr>
                <th>Urutan</th>
                <th>Pertanyaan</th>
                <th>Jawaban</th>
                <th>Status</th>
                <th>Aksi</th>
              </tr>
            </thead>
            <tbody id="faqTbody">
              <tr><td colspan="5" class="text-center py-4">Memuat data FAQ...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <!-- MODAL FORM FAQ -->
  <div class="modal fade" id="faqModal" tabindex="-1" aria-labelledby="faqModalTitle" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered">
      <div class="modal-content modal-content-custom">
        <div class="modal-header modal-header-custom d-flex justify-content-between align-items-center">
          <h3 class="modal-title h6 mb-0" id="faqModalTitle">Tambah FAQ</h3>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Tutup"></button>
        </div>
        <form id="faqForm">
          <div class="modal-body modal-body-custom">
            <div class="mb-3">
              <label class="custom-label" for="faqPertanyaanInput">Pertanyaan *</label>
              <input type="text" id="faqPertanyaanInput" class="custom-input" placeholder="Contoh: Berapa batas minimal pemesanan (MOQ)?" required>
            </div>
            <div class="mb-3">
              <label class="custom-label" for="faqJawabanInput">Jawaban Lengkap *</label>
              <textarea id="faqJawabanInput" class="custom-input" style="min-height:120px;" placeholder="Tuliskan jawaban yang ramah dan jelas..." required></textarea>
            </div>
            <div class="row g-2 mb-2">
              <div class="col-6">
                <label class="custom-label" for="faqUrutanInput">Nomor Urutan Tampil</label>
                <input type="number" id="faqUrutanInput" class="custom-input" value="1" min="0">
              </div>
              <div class="col-6 d-flex align-items-end pb-2">
                <div class="form-check">
                  <input class="form-check-input" type="checkbox" id="faqIsActiveInput" checked>
                  <label class="form-check-label small fw-bold" for="faqIsActiveInput">Tampilkan di Accordion Publik</label>
                </div>
              </div>
            </div>
          </div>
          <div class="modal-footer modal-footer-custom">
            <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal" style="border-radius:var(--radius);">Batal</button>
            <button type="submit" class="btn-primary-custom" style="padding:8px 18px; font-size:0.875rem;">Simpan FAQ</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="js/auth-guard.js"></script>
  <script type="module">
    import { initAdminLayout } from './js/admin-layout.js';
    initAdminLayout('faq');
  </script>
  <script type="module" src="js/faq.js"></script>
</body>
</html>
