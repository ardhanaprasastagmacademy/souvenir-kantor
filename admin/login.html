<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Administrator | Kenes Souvenir Kantor</title>
  <meta name="robots" content="noindex, nofollow">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,600;1,6..96,400&family=Hanken+Grotesk:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/style.css">
  <link rel="stylesheet" href="/assets/css/admin.css">
</head>
<body class="bg-cream d-flex align-items-center justify-content-center min-vh-100 p-3">

  <div class="card p-4 p-md-5 border" style="max-width: 440px; width:100%; background:var(--cream-soft); border-color:var(--line) !important; border-radius:var(--radius-lg); box-shadow:0 8px 30px rgba(35,27,22,0.06);">
    <div class="text-center mb-4">
      <div class="brand-wordmark" style="color:var(--ink); font-size:1.85rem; justify-content:center;">
        KENES
      </div>
      <span class="eyebrow mt-1 mb-2">Panel Administrasi</span>
      <p class="text-muted-custom small mb-0">Masuk untuk mengelola produk, artikel blog, portofolio, dan pesan pelanggan.</p>
    </div>

    <div id="loginAlertBox" style="display:none;" class="alert alert-danger py-2 small" role="alert"></div>

    <form id="loginForm">
      <div class="mb-3">
        <label class="custom-label" for="loginEmail">Email Admin</label>
        <input type="email" id="loginEmail" class="custom-input" placeholder="admin@kenessouvenir.com" value="admin@kenessouvenir.com" required>
      </div>

      <div class="mb-4">
        <div class="d-flex justify-content-between align-items-center mb-1">
          <label class="custom-label mb-0" for="loginPassword">Kata Sandi</label>
          <a href="#" id="btnForgotPassword" class="small text-muted-custom text-decoration-none">Lupa sandi?</a>
        </div>
        <input type="password" id="loginPassword" class="custom-input" placeholder="••••••••" value="admin123" required>
      </div>

      <button type="submit" id="btnLoginSubmit" class="btn-primary-custom w-100 mb-3">
        Masuk ke Dashboard
      </button>

      <div class="p-3 bg-cream-deep border border-warning-subtle small text-muted-custom" style="border-radius:var(--radius);">
        <strong>Info Akun Demo:</strong><br>
        Email: <code>admin@kenessouvenir.com</code><br>
        Password: <code>admin123</code>
      </div>
    </form>

    <div class="text-center mt-4 pt-3 border-top" style="border-color:var(--line) !important;">
      <a href="../index.html" class="small text-muted-custom text-decoration-none">← Kembali ke Halaman Publik</a>
    </div>
  </div>

  <!-- Modal Lupa Password -->
  <div class="modal fade" id="forgotModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content modal-content-custom">
        <div class="modal-header modal-header-custom">
          <h5 class="modal-title h6 mb-0">Pemulihan Kata Sandi</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body modal-body-custom">
          <p class="small text-muted-custom mb-3">Masukkan email akun admin Anda. Tautan pemulihan akan dikirimkan.</p>
          <input type="email" id="resetEmailInput" class="custom-input mb-3" placeholder="admin@kenessouvenir.com">
          <button type="button" id="btnSendReset" class="btn-primary-custom w-100">Kirim Instruksi Pemulihan</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module">
    import { AuthService } from '../assets/js/firebase-config.js';
    import './js/auth-guard.js';

    const loginForm = document.getElementById('loginForm');
    const alertBox = document.getElementById('loginAlertBox');
    const submitBtn = document.getElementById('btnLoginSubmit');

    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      alertBox.style.display = 'none';
      submitBtn.disabled = true;
      submitBtn.textContent = 'Memverifikasi...';

      const email = document.getElementById('loginEmail').value.trim();
      const pass = document.getElementById('loginPassword').value.trim();

      const result = await AuthService.login(email, pass);
      if (result.success) {
        window.location.replace('index.html');
      } else {
        alertBox.textContent = result.error || 'Email atau password tidak sesuai.';
        alertBox.style.display = 'block';
        submitBtn.disabled = false;
        submitBtn.textContent = 'Masuk ke Dashboard';
      }
    });

    document.getElementById('btnForgotPassword').addEventListener('click', (e) => {
      e.preventDefault();
      const modal = new bootstrap.Modal(document.getElementById('forgotModal'));
      modal.show();
    });

    document.getElementById('btnSendReset').addEventListener('click', async () => {
      const email = document.getElementById('resetEmailInput').value.trim();
      if (!email) return alert('Silakan masukkan email.');
      const res = await AuthService.resetPassword(email);
      alert(res.message);
      bootstrap.Modal.getInstance(document.getElementById('forgotModal')).hide();
    });
  </script>
</body>
</html>
