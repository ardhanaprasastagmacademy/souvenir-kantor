<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kelola Kategori Produk | Kenes Souvenir Kantor</title>
  <meta name="robots" content="noindex, nofollow">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,600;1,6..96,400&family=Hanken+Grotesk:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="../assets/css/admin.css">
</head>
<body class="admin-body">

  <div id="adminSidebarContainer"></div>

  <div class="admin-main-wrap">
    <div id="adminTopbarContainer"></div>

    <main class="admin-content-area">
      <div class="d-flex flex-wrap justify-content-between align-items-center mb-4 gap-3">
        <div>
          <span class="eyebrow">Struktur Katalog</span>
          <h1 class="h2 mb-0">Kategori Produk</h1>
          <p class="text-muted-custom small mb-0">Kelola kelompok produk souvenir untuk mempermudah navigasi pengunjung.</p>
        </div>
        <button type="button" class="btn-primary-custom" id="btnOpenAddCategory">
          + Tambah Kategori Baru
        </button>
      </div>

      <div class="admin-card">
        <div class="admin-table-wrap">
          <table class="admin-table">
            <thead>
              <tr>
                <th>Urutan</th>
                <th>Nama Kategori</th>
                <th>Slug URL</th>
                <th>Jumlah Produk</th>
                <th>Aksi</th>
              </tr>
            </thead>
            <tbody id="categoryTbody">
              <tr><td colspan="5" class="text-center py-4">Memuat data kategori...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <!-- MODAL FORM KATEGORI -->
  <div class="modal fade" id="categoryModal" tabindex="-1" aria-labelledby="categoryModalTitle" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content modal-content-custom">
        <div class="modal-header modal-header-custom d-flex justify-content-between align-items-center">
          <h3 class="modal-title h6 mb-0" id="categoryModalTitle">Tambah Kategori</h3>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Tutup"></button>
        </div>
        <form id="categoryForm">
          <div class="modal-body modal-body-custom">
            <div class="mb-3">
              <label class="custom-label" for="catNameInput">Nama Kategori *</label>
              <input type="text" id="catNameInput" class="custom-input" placeholder="Contoh: Tumbler & Botol" required>
            </div>
            <div class="mb-3">
              <label class="custom-label" for="catSlugInput">Slug URL *</label>
              <input type="text" id="catSlugInput" class="custom-input" placeholder="tumbler-botol" required>
            </div>
            <div class="mb-3">
              <label class="custom-label" for="catUrutanInput">Nomor Urutan Tampil</label>
              <input type="number" id="catUrutanInput" class="custom-input" value="1" min="0">
            </div>
          </div>
          <div class="modal-footer modal-footer-custom">
            <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal" style="border-radius:var(--radius);">Batal</button>
            <button type="submit" class="btn-primary-custom" style="padding:8px 18px; font-size:0.875rem;">Simpan Kategori</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="js/auth-guard.js"></script>
  <script type="module">
    import { initAdminLayout } from './js/admin-layout.js';
    initAdminLayout('kategori');
  </script>
  <script type="module" src="js/kategori.js"></script>
</body>
</html>
