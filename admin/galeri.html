<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kelola Galeri Portofolio | Kenes Souvenir Kantor</title>
  <meta name="robots" content="noindex, nofollow">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,600;1,6..96,400&family=Hanken+Grotesk:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="../assets/css/admin.css">
</head>
<body class="admin-body">

  <div id="adminSidebarContainer"></div>

  <div class="admin-main-wrap">
    <div id="adminTopbarContainer"></div>

    <main class="admin-content-area">
      <div class="d-flex flex-wrap justify-content-between align-items-center mb-4 gap-3">
        <div>
          <span class="eyebrow">Dokumentasi Nyata</span>
          <h1 class="h2 mb-0">Galeri Portofolio Produksi</h1>
          <p class="text-muted-custom small mb-0">Foto hasil produksi cinderamata untuk portofolio dan beranda.</p>
        </div>
        <button type="button" class="btn-primary-custom" id="btnOpenAddGallery">
          + Unggah Foto Portofolio
        </button>
      </div>

      <div class="admin-card">
        <div class="admin-table-wrap">
          <table class="admin-table">
            <thead>
              <tr>
                <th>Foto</th>
                <th>Judul / Caption</th>
                <th>Kategori</th>
                <th>Urutan</th>
                <th>Status</th>
                <th>Aksi</th>
              </tr>
            </thead>
            <tbody id="galleryTbody">
              <tr><td colspan="6" class="text-center py-4">Memuat foto galeri...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <!-- MODAL FORM GALERI -->
  <div class="modal fade" id="galleryModal" tabindex="-1" aria-labelledby="galleryModalTitle" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content modal-content-custom">
        <div class="modal-header modal-header-custom d-flex justify-content-between align-items-center">
          <h3 class="modal-title h6 mb-0" id="galleryModalTitle">Unggah Foto Galeri</h3>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Tutup"></button>
        </div>
        <form id="galleryForm">
          <div class="modal-body modal-body-custom">
            <div class="mb-3">
              <label class="custom-label" for="galJudulInput">Judul / Keterangan Pekerjaan *</label>
              <input type="text" id="galJudulInput" class="custom-input" placeholder="Contoh: Pengadaan 500 Pcs Tumbler PT Pertamina" required>
            </div>
            <div class="mb-3">
              <label class="custom-label" for="galKategoriInput">Kategori Portofolio</label>
              <input type="text" id="galKategoriInput" class="custom-input" placeholder="Tumbler, Agenda, Seminar Kit, dsb.">
            </div>
            <div class="mb-3">
              <label class="custom-label">Gambar Portofolio</label>
              <input type="url" id="galUrlInput" class="custom-input mb-2" placeholder="URL Foto (https://...)">
              <input type="file" id="galFileInput" class="custom-input" accept="image/*" style="padding-top:10px;">
              <small class="text-muted-custom">Pilih file dari perangkat atau masukkan URL foto.</small>
            </div>
            <div class="row g-2 mb-3">
              <div class="col-6">
                <label class="custom-label" for="galUrutanInput">Urutan Tampil</label>
                <input type="number" id="galUrutanInput" class="custom-input" value="1" min="0">
              </div>
              <div class="col-6 d-flex align-items-end pb-2">
                <div class="form-check">
                  <input class="form-check-input" type="checkbox" id="galIsActiveInput" checked>
                  <label class="form-check-label small fw-bold" for="galIsActiveInput">Tampilkan Publik</label>
                </div>
              </div>
            </div>
          </div>
          <div class="modal-footer modal-footer-custom">
            <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal" style="border-radius:var(--radius);">Batal</button>
            <button type="submit" class="btn-primary-custom" id="btnSaveGallery" style="padding:8px 18px; font-size:0.875rem;">Simpan Foto</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="js/auth-guard.js"></script>
  <script type="module">
    import { initAdminLayout } from './js/admin-layout.js';
    initAdminLayout('galeri');
  </script>
  <script type="module" src="js/galeri.js"></script>
</body>
</html>
