<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kelola Testimoni Klien | Kenes Souvenir Kantor</title>
  <meta name="robots" content="noindex, nofollow">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,600;1,6..96,400&family=Hanken+Grotesk:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="../assets/css/admin.css">
</head>
<body class="admin-body">

  <div id="adminSidebarContainer"></div>

  <div class="admin-main-wrap">
    <div id="adminTopbarContainer"></div>

    <main class="admin-content-area">
      <div class="d-flex flex-wrap justify-content-between align-items-center mb-4 gap-3">
        <div>
          <span class="eyebrow">Bukti Sosial B2B</span>
          <h1 class="h2 mb-0">Ulasan & Testimoni Rekanan</h1>
          <p class="text-muted-custom small mb-0">Kutipan ulasan dari perwakilan perusahaan atau instansi yang tampil di section gelap beranda.</p>
        </div>
        <button type="button" class="btn-primary-custom" id="btnOpenAddTesti">
          + Tambah Testimoni Baru
        </button>
      </div>

      <div class="admin-card">
        <div class="admin-table-wrap">
          <table class="admin-table">
            <thead>
              <tr>
                <th>Nama Klien</th>
                <th>Instansi / Perusahaan</th>
                <th>Kutipan Ulasan</th>
                <th>Status</th>
                <th>Aksi</th>
              </tr>
            </thead>
            <tbody id="testiTbody">
              <tr><td colspan="5" class="text-center py-4">Memuat data testimoni...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <!-- MODAL FORM TESTIMONI -->
  <div class="modal fade" id="testiModal" tabindex="-1" aria-labelledby="testiModalTitle" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content modal-content-custom">
        <div class="modal-header modal-header-custom d-flex justify-content-between align-items-center">
          <h3 class="modal-title h6 mb-0" id="testiModalTitle">Tambah Testimoni</h3>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Tutup"></button>
        </div>
        <form id="testiForm">
          <div class="modal-body modal-body-custom">
            <div class="mb-3">
              <label class="custom-label" for="testiNamaInput">Nama Lengkap & Gelar *</label>
              <input type="text" id="testiNamaInput" class="custom-input" placeholder="Contoh: Bambang Sudarmono" required>
            </div>
            <div class="mb-3">
              <label class="custom-label" for="testiPerusahaanInput">Jabatan & Nama Perusahaan *</label>
              <input type="text" id="testiPerusahaanInput" class="custom-input" placeholder="Senior Procurement — PT Telkom Indonesia" required>
            </div>
            <div class="mb-3">
              <label class="custom-label" for="testiIsiInput">Kutipan Ulasan *</label>
              <textarea id="testiIsiInput" class="custom-input" style="min-height:100px;" placeholder="Tuliskan pengalaman kerja sama, ketepatan waktu, dan kualitas barang..." required></textarea>
            </div>
            <div class="form-check">
              <input class="form-check-input" type="checkbox" id="testiIsActiveInput" checked>
              <label class="form-check-label small fw-bold" for="testiIsActiveInput">Tampilkan di Slider Beranda</label>
            </div>
          </div>
          <div class="modal-footer modal-footer-custom">
            <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal" style="border-radius:var(--radius);">Batal</button>
            <button type="submit" class="btn-primary-custom" style="padding:8px 18px; font-size:0.875rem;">Simpan Testimoni</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="js/auth-guard.js"></script>
  <script type="module">
    import { initAdminLayout } from './js/admin-layout.js';
    initAdminLayout('testimoni');
  </script>
  <script type="module" src="js/testimoni.js"></script>
</body>
</html>
